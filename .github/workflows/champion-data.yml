name: Champion data pack

# 数据仓库专用：把代码仓库 checkout 到 src/，克隆上游 Showdown，跑两个生成脚本，
# 再把数据包作为【本仓库】的 Release asset 发布。
# app 端填固定地址：https://github.com/scvrqh/ConnectionNationaldexMovesDamage/releases/latest/download/champion-pack.json
#
# 必须跑在 windows-latest：生成脚本调用 @esbuild/win32-x64/esbuild.exe（硬编码平台二进制）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '数据包版本号 YYYYMMDD，留空取上游 PS 提交日期'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout generator code
        uses: actions/checkout@v4
        with:
          repository: scvrqh/NationaldexMovesDamage
          path: src
          # 代码仓库若为 private，取消下一行注释，并在 Secrets 里配置 SOURCE_REPO_TOKEN（需 repo 读权限）
          # token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone upstream Pokemon Showdown (shallow)
        shell: pwsh
        run: |
          $dest = 'src/repo2/caches/pokemon-showdown'
          New-Item -ItemType Directory -Force -Path 'src/repo2/caches' | Out-Null
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git $dest
          if (-not (Test-Path "$dest/data/mods/champions")) { throw 'upstream checkout has no data/mods/champions' }

      - name: Install generator dependencies
        working-directory: src/tools
        run: npm ci

      - name: Regenerate champions data from upstream
        run: node src/tools/gen-champions-ps.mjs

      - name: Build versioned data pack
        shell: pwsh
        run: |
          $src = Join-Path $env:TMP 'champions-ps.json'
          if (-not (Test-Path $src)) { throw "gen-champions-ps.mjs did not produce $src" }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $pack = Join-Path $PWD 'dist/champion-pack.json'
          $cliArgs = @('src/tools/gen-champion-pack.mjs', "--src=$src", "--out=$pack")
          if ('${{ inputs.version }}' -ne '') { $cliArgs += "--version=${{ inputs.version }}" }
          node @cliArgs

      - name: Resolve version and tag
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -Path 'dist/champion-pack.json' | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=champion-data-$version" >> $env:GITHUB_OUTPUT

      - name: Skip when this version is already published
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.ver.outputs.tag }}' --repo '${{ github.repository }}'
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT }
          else { "skip=false" >> $env:GITHUB_OUTPUT }

      - name: Publish release asset
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/champion-pack.json
          fail_on_unmatched_files: true
          body: |
            Champions 数据包，version ${{ steps.ver.outputs.version }}。

            固定直链：https://github.com/${{ github.repository }}/releases/latest/download/champion-pack.json

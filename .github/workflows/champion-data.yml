name: Champion data pack

# 自包含：本仓库里放着生成脚本（tools/）与基线数据（core-model/.../champions.json）的副本，
# 不依赖任何其它仓库。作业从上游 Pokemon Showdown 重新生成数据，发布到本仓库的 Release。
# app 端固定地址：https://github.com/scvrqh/ConnectionNationaldexMovesDamage/releases/latest/download/champion-pack.json
#
# 必须跑在 windows-latest：tools/lib/load-ts.mjs 调用 @esbuild/win32-x64/esbuild.exe（硬编码平台二进制）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '数据包版本号 YYYYMMDD，留空取上游 PS 提交日期'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone upstream Pokemon Showdown (shallow)
        shell: pwsh
        run: |
          $dest = 'repo2/caches/pokemon-showdown'
          New-Item -ItemType Directory -Force -Path 'repo2/caches' | Out-Null
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git $dest
          if (-not (Test-Path "$dest/data/mods/champions")) { throw 'upstream checkout has no data/mods/champions' }

      - name: Install generator dependencies
        working-directory: tools
        run: npm ci

      - name: Regenerate champions data from upstream
        run: node tools/gen-champions-ps.mjs

      - name: Build versioned data pack
        shell: pwsh
        run: |
          $src = Join-Path $env:TMP 'champions-ps.json'
          if (-not (Test-Path $src)) { throw "gen-champions-ps.mjs did not produce $src" }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $pack = Join-Path $PWD 'dist/champion-pack.json'
          $cliArgs = @('tools/gen-champion-pack.mjs', "--src=$src", "--out=$pack")
          if ('${{ inputs.version }}' -ne '') { $cliArgs += "--version=${{ inputs.version }}" }
          node @cliArgs

      - name: Resolve version and tag
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -Path 'dist/champion-pack.json' | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=champion-data-$version" >> $env:GITHUB_OUTPUT

      - name: Skip when this version is already published
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.ver.outputs.tag }}' --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT }
          else { "skip=false" >> $env:GITHUB_OUTPUT }
          # gh 在 release 不存在时返回 1，pwsh 步骤会继承这个退出码并判失败；
          # 这里显式收尾，让「查不到 = 该发布」成为正常分支。
          exit 0

      - name: Attach latest usage index
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases/latest 只指向最近创建的那个 release：两类数据各有自己的 release，
          # 所以每次发布都把另一类的最新文件一并挂上，latest/download/ 下两份就一直在。
          $repo = '${{ github.repository }}'
          $list = gh release list --repo $repo --limit 200 --json tagName,createdAt | ConvertFrom-Json
          $src = @($list | Where-Object { $_.tagName -like 'usage-data-*' } | Sort-Object createdAt -Descending)[0]
          if ($null -eq $src) {
            Write-Host '::warning::还没有 usage-data-* 发布，本次不附带使用率索引'
          } else {
            Write-Host "附上 使用率索引：$($src.tagName)"
            gh release download $src.tagName --repo $repo --pattern usage-index.json --dir dist --clobber
          }
      - name: Publish release asset
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/champion-pack.json
            dist/usage-index.json
          fail_on_unmatched_files: false
          body: |
            Champions 数据包，version ${{ steps.ver.outputs.version }}。

            固定直链：https://github.com/${{ github.repository }}/releases/latest/download/champion-pack.json

      - name: Verify releases/latest carries both packs
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $tag = gh release view --repo $repo --json tagName -q .tagName
          $names = (gh release view $tag --repo $repo --json assets --jq '.assets[].name') -split '\r?\n'
          foreach ($f in @('champion-pack.json', 'usage-index.json')) {
            if ($names -notcontains $f) { Write-Host "::error::最新 release $tag 缺少 $f"; exit 1 }
          }
          Write-Host "latest ($tag) 同时带 champion-pack.json 与 usage-index.json"
